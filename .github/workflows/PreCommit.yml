name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - run: julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/JuliaEditorSupport/JuliaFormatter.jl", rev="3b196afa4a8ed92ba816edec6d122145e311ae35")'
      - uses: pre-commit/action@v3.0.1
